[PACKAGES_LIST]
# 기본 유틸리티
git=
vim=
curl=
wget=
net-tools=
iputils-ping=
openssh-server=
locales=
software-properties-common=

# --- Application Profiles ---
# 프로필 섹션이 존재하면 해당 애플리케이션 설치를 시도합니다.
# 필요한 옵션은 각 섹션 내 변수로 정의합니다.

[ROS2_PROFILE]
# Ubuntu 버전에 맞춰 자동 감지되지만, 명시하고 싶다면 distro 설정 가능 (예: humble)
distro=humble
type=desktop

