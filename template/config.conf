# ==============================================================================
# 서버 통합 설정 파일 (server.conf)
# ==============================================================================

# --- 1. 전역 설정 ---
# 서버의 기본 동작과 관련된 변수를 정의합니다.

[PACKAGES_LIST]
# This section records the installation status of system packages.
# The value will be the installation timestamp.

[DRIVER_LIST]
# This section records installed drivers (e.g., nvidia-driver).

[APPLICATION_LIST]
# This section records the installation status of additional applications.
# The value will be the installation timestamp (e.g., "2026-01-15T12:00:00").

[CUSTOM_SERVICES]
# 이 섹션은 스크립트에 의해 동적으로 채워집니다.
# 예: server_observer="2025-08-24 21:11:22"

[USER]
# 사용자 관련 설정
USER_HOME_BASE="/mnt/homes"


# ==============================================================================
# 2. 마운트 프로필 설정
# - 각 [섹션]은 하나의 마운트 프로필을 의미합니다.
# ==============================================================================

# # 예시 1: 단순 마운트 프로필
# [STORAGE_PROFILE_homes]
# PROFILE_TYPE="direct"
# SOURCE_DISK="/dev/sdb"
# FSTYPE="ext4"

# # DEFINE_PARTITION_[파티션별칭]="size=[크기%]; mount=[마운트포인트]"
# DEFINE_PARTITION_homes="size=100%; mount=/mnt/homes"

# # 예시 2: LVM 스택 프로필 -> lvm을 이용한 단순 볼륨
# [STORAGE_PROFILE_dataset0]
# PROFILE_TYPE="lvm"
# VG_NAME="vg_dataset_0"

# # /dev/sdc 전체를 사용하는 data_vol 논리 볼륨을 정의합니다.
# VG_DEVICES="/dev/sdc"
# DEFINE_LV_data_vol_0="size=100%FREE; devices=/dev/sdc"

# # lvm을 마운트 작업
# MOUNT_TARGET="data_vol_0"
# MOUNT_POINT="/mnt/dataset_0"
# FSTYPE="xfs"

# # 예시 3: LVM 스택 프로필 -> lvm을 이용한 복잡한 구조의 구성
# [STORAGE_PROFILE_dataset1]
# PROFILE_TYPE="lvm"
# VG_NAME="vg_dataset_1"
# # /dev/sdd /dev/sde를 raid-0로 구성하고, /dev/sdc를 raid-1로 구성하여 data_vol 논리 볼륨을 정의합니다.
# VG_DEVICES="/dev/sdc /dev/sdd /dev/sde /dev/nvme0n1"
# DEFINE_LV_stripe_vol="type=raid0; size=100%FREE; devices=/dev/sdd /dev/sde"
# DEFINE_LV_data_vol_1="type=raid1; devices=/dev/sdc LV:stripe_vol"

# # /dev/nvme0n1로 캐시 추가
# CACHE_TARGET="data_vol_1"
# CACHE_DEVICE="/dev/nvme0n1"

# # lvm을 마운트 작업
# MOUNT_TARGET="data_vol_1"
# MOUNT_POINT="/mnt/dataset_1"
# FSTYPE="xfs"

# # 예시 3: CIFS를 이용한 원격 공유 폴더 마운트
# [STORAGE_PROFILE_CIFS_Remote]
# PROFILE_TYPE="cifs"
# REMOTE_SERVER="192.168.1.100"
# REMOTE_PATH="share"
# MOUNT_POINT="/mnt/remote_share"

# # /etc/fstab에 전달될 마운트 옵션. uid, gid는 마운트된 폴더의 소유자/그룹을 지정.
# OPTIONS="defaults,uid=1000,gid=1000,iocharset=utf8"

# # 사용자 이름과 비밀번호가 저장된 인증 파일의 절대 경로
# # (보안을 위해 root만 읽을 수 있도록 chmod 600으로 설정해야 함)
# CIFS_CREDENTIAL="/root/.credentials/cifs_auth"
