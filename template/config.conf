# ==============================================================================
# ASAP 통합 설정 템플릿 (config.conf)
# 설명: 시스템의 '원하는 상태'를 정의합니다. (상태 기록은 system.state에서 수행)
# ==============================================================================

# --- [시스템 패키지 목록] ---
# 설치하고자 하는 패키지를 키로, 특정 버전을 값으로 설정합니다. (비워두면 최신 설치)
[PACKAGES_LIST]
git=
vim=
curl=
wget=
net-tools=
iputils-ping=
openssh-server=
locales=
software-properties-common=

# --- [드라이버 목록] ---
# 설치하고자 하는 드라이버 패키지 명을 설정합니다.
[DRIVER_LIST]
# nvidia-driver=580

# --- [사용자 설정] ---
[USER]
# 새로운 사용자가 생성될 때의 홈 디렉터리 기반 경로 (예: /mnt/homes/user1)
USER_HOME_BASE="/home"


# ==============================================================================
# 어플리케이션 프로필
# - 각 섹션이 존재하면 해당 어플리케이션 설치를 시도합니다.
# ==============================================================================

# [CONDA_PROFILE]
# mode=user            # user (사용자 홈), system (/opt)
# type=miniconda       # miniconda, anaconda

# [ROS2_PROFILE]
# distro=humble        # humble, foxy, jazzy 등
# type=desktop         # desktop, ros-base

# [OPENCV_PROFILE]
# version=4.10.0
# with_cuda=OFF
# gpu_arch=
# jobs=4
# prefix=/usr/local

# [CUDA_TOOLKIT_PROFILE]
# version=12.4.1
# arch=x86_64

# [CUDNN_LIBRARY_PROFILE]
# version=8.9.7.29-1+cuda11.8

# [VSCODE_PROFILE]
# (옵션 없음, 섹션 존재만으로 설치 시도)

# [DOCKER_PROFILE]
# (옵션 없음, 섹션 존재만으로 설치 시도)


# ==============================================================================
# 마운트(저장소) 프로필 설정
# - STORAGE_PROFILE_ 접두사로 시작하는 섹션을 정의합니다.
# ==============================================================================

# --- 예시 1: 단일 파티션 마운트 ---
# [STORAGE_PROFILE_data_disk]
# PROFILE_TYPE="direct"
# SOURCE_DISK="/dev/sdb"
# FSTYPE="ext4"
# DEFINE_PARTITION_1="size=100%; mount=/mnt/data"

# --- 예시 2: LVM 스택 (단순 볼륨) ---
# [STORAGE_PROFILE_lvm_simple]
# PROFILE_TYPE="lvm"
# VG_NAME="vg_data"
# VG_DEVICES="/dev/sdc"
# DEFINE_LV_vol0="size=100%FREE; devices=/dev/sdc"
# MOUNT_TARGET="vol0"
# MOUNT_POINT="/mnt/lvm_data"
# FSTYPE="xfs"

# --- 예시 3: LVM 스택 (복합 구성: RAID + Cache) ---
# [STORAGE_PROFILE_lvm_advanced]
# PROFILE_TYPE="lvm"
# VG_NAME="vg_fast_storage"
# VG_DEVICES="/dev/sdd /dev/sde /dev/nvme0n1"
# DEFINE_LV_stripe_vol="type=raid0; size=100%FREE; devices=/dev/sdd /dev/sde"
# CACHE_TARGET="stripe_vol"
# CACHE_DEVICE="/dev/nvme0n1"
# MOUNT_TARGET="stripe_vol"
# MOUNT_POINT="/mnt/fast_data"
# FSTYPE="xfs"

# --- 예시 4: CIFS 원격 마운트 ---
# [STORAGE_PROFILE_backup_cifs]
# PROFILE_TYPE="cifs"
# REMOTE_SERVER="192.168.1.100"
# REMOTE_PATH="share"
# MOUNT_POINT="/mnt/remote_backup"
# OPTIONS="defaults,uid=1000,gid=1000,iocharset=utf8"
# CIFS_CREDENTIAL="/root/.credentials/cifs_auth"


# ==============================================================================
# 네트워크 프로필 설정
# - NETWORK_PROFILE_ 접두사로 시작하는 섹션을 정의합니다.
# ==============================================================================

# [NETWORK_PROFILE_static_internal]
# INTERFACE="eth0"
# METHOD="manual"
# ADDRESS="192.168.1.100/24"
# GATEWAY="192.168.1.1"
# DNS="8.8.8.8"
