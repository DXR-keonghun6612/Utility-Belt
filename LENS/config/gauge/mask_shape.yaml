# 잣대 (gauge) — **정본이 든 형상 벡터를 무엇으로 접어 비교하나.**
#
# 값을 만드는 것은 여기가 아니다. flow 의 `radial_profile` 이 정본에 `radial_rle` 을 넣고(눈금도
# 거기 적힌다 — `config/flow/shape_profile.yaml`), 이 파일은 그것을 **재는 자**만 정한다.
#
# 그래서 수명이 다르다: feature 를 고치면 flow 를 다시 돌려야 하지만, **잣대는 고쳐도 다시 안 뽑는다**
# (저장된 원본을 다시 접기만 하면 된다). 분석 창이 열 때마다 이 파일을 따라간다.
#
# 안 적은 feature 는 자기 이름의 **항등 잣대**를 갖는다.
#
# radial 은 **두 축으로 가른다.** 둘을 합치면 (살합, 외곽r) 이라 상보적이지만, 한 도메인으로 묶으면
#   ① 정규화 상수를 공유해 거리에서 각 채널의 몫이 그 채널의 원 분산에 비례한다 (의도한 가중이 아니다)
#   ② 노이즈 바닥이 다른데 k 를 하나만 줄 수 있다 (도넛÷솔리드 최근접비 signed 2.45 / outline 0.89)
# 무엇보다 불변식이 "슬롯 1의 30px 과 슬롯 3의 30px 이 같은 뜻" 인데, signed 의 30px 과 outline 의
# 30px 은 단위만 같고 교환 가능하지 않다 — 하나는 부호 있는 재료 수지, 하나는 바깥 반경이다.
#
# 갈라 두면 **불일치가 읽힌다**: outline type 은 같은데 signed type 이 다르면 "실루엣은 같고 구멍이
# 다르다" 다. 원래 하려던 오검출 검사가 그것이다.
#
# radial_rle 자체는 축으로 안 돌린다 — 저장 원본으로만 남는다. 슬롯 배치까지 보면 광선이 구멍을
# 스칠 때 밴드가 하나 늘며 값이 계단으로 뛰어 도넛이 하나도 안 붙는다(실측 배정률 0.0%).

gauges:
    # 구멍까지 담은 양. Σ(부호×슬롯) = 2·살합 − 외곽r  (짝수 슬롯이 빈 공간이라 음수)
    radial_signed:
        feature: radial_rle
        folds: [signed]
    # 실루엣. rle.sum(-1) = 외곽r        실측 도넛 배정률 97.0%
    radial_outline:
        feature: radial_rle
        folds: [outline]
