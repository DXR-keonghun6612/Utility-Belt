# 분석용 형상 데이터 — **이미 객체가 있는 정본**에 `radial_rle` 배열 + 객체별 `pose` 를 얹는다.
#
# 검출 flow(`extract_mask_by_detection_flows.yaml`)의 마지막 단계와 **같은 유닛·같은 눈금**이다.
# 둘을 함께 두는 이유는 도는 시점이 다르기 때문이다:
#
#   검출 flow 에 붙여서   객체를 만들면서 그 자리에서 — 새로 들인 데이터
#   이 flow 로 따로       객체는 이미 있고 배열만 필요할 때
#                        · 사람이 mask 를 고친 뒤 다시 뜨기 (GUI 저장도 같은 일을 한 stem 에 한다)
#                        · 눈금을 바꿔 전수를 다시 뜨기
#                        · 옛 정본 백필 (이 유닛이 생기기 전에 만든 것)
#
# 검출을 다시 돌리면 사람이 고친 라벨이 덮이므로, 그 경우에 **검출 없이 형상만** 다시 뜨는 길이
# 반드시 있어야 한다 — 그것이 이 파일이다.
#
# ⚠ **눈금을 바꾸면 옛 배열과 비교할 수 없다.** 표본끼리 같은 자 위에 서야 묶기가 성립하므로,
# 바꿨으면 **전수를 다시 뜨고** `.analysis` 도 다시 적재한다(옛 캐시는 옛 눈금이다).
# 실제로 쓴 값은 정본 `params/profile_spec` 에 남는다.
#
# ⚠ **`unit: frame` 이고 입력은 `object` 다.** 배열의 행이 곧 obj_id 라, 객체 순서가 확정된
# 정본에 대고 돌려야 행과 객체가 맞는다(GUI 저장 정돈이 그 순서를 정한다).

flows:
-   object_type: flow
    name: Build_shape_profile
    unit: frame
    processes:
    # 형상을 **비교 가능한 좌표로** 옮긴다 — 무게중심·주축각으로 정준화한 극좌표의 밴드 배치.
    # 정렬이 이미 들어 있어 표본끼리 그냥 겹쳐 볼 수 있다(class·type 템플릿·정합의 입력).
    -   object_type: radial_profile
        crop: 280                      # bbox 중심 크롭 창 (원본 스케일)
        size: 280                      # 정준 캔버스 — crop 과 같으면 축소 없음
        num_radial: 280                # 반경 눈금 (캔버스 한 변과 같으면 1px 간격)
        num_angular: 512               # θ 토큰 수 = 배열 첫 축
        max_transitions: 8             # θ 당 최대 전이점 = 배열 둘째 축
        threshold: 0.5                 # 셀을 '재료 있음' 으로 볼 occupancy 분수 하한
        outputs:
            # level: frame — **배열은 stem 한 장이다.** 안 적으면 기본값이 object 라 첫 객체에
            # 붙어 버린다(파일도 `{stem}_{obj}.npy` 가 된다).
            radial_rle: {to: storage, level: frame, type: array, format: npy}
            object: {}                 # 객체마다 pose (자리 + 주축각) — 같은 패스에서 나온다
