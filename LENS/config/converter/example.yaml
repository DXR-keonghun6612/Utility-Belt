converter:
    object_type: glob
    sources: ['C:/Users/junei/Documents/temp/Utility-Belt/LENS/temp/sl_confused']
    globs:
        # 칸은 셋: pattern + ext 로 파일을 찾고(*_rgb + png → '*_rgb.png'), type 이 핸들러다.
        # 확장자는 하나뿐이다 — 찾을 때도, 저장할 때도 같은 값을 쓴다(ingest 는 복사이지 변환이 아니다).
        # type 은 필수 — 확장자로 추론하지 않는다 (png 는 image 일 수도 mask 일 수도 있다).
        frame:
            pattern: '*_rgb'
            ext: png
            type: image
        class_id:
            pattern: '*_label'
            ext: txt
            type: attr        # 인라인 — 파일을 안 남기고 텍스트를 값으로 읽는다
