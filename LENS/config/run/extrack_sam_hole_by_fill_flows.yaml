# SAM3 부품 mask 에서 "메워진 구멍·슬릿"을 LoG edge + 배경색 fill 로 다시 뚫는 per-frame flow.
#
# 프레임마다:
#   1. segment              — 객체 bbox 를 SAM3 로 분할해 부품 라벨맵 segment (구멍이 메워진 solid).
#   2. carve_color_holes    — 편집기 fill 과 같은 cv2.floodFill(FIXED_RANGE + LoG 벽)로 뺀다.
#                              mask 평균색(μ_obj)에서 크게 벗어난 내부 픽셀을 자동 seed 로 floodFill 하되
#                              (몸통과 색이 확 다른 구멍 = 클릭 대상), LoG edge·mask 바깥을 벽으로 심어
#                              부품 밖으로 안 새게 한다. 반사광은 RGB 밝기 임계로 seed 제외 + morphology
#                              open 으로 제거. Mahalanobis·Pass-2 없이 순수 CV. 관통부(구멍/슬릿)를 뚫는다.
#   3. split_objects        — 구멍 뚫린 mask 를 인스턴스로 재분할.
#
# 전제: 프레임에 객체 bbox 가 이미 있어야 한다(raw 추출 flow 선행). edge 방식(by_edge)과 대칭 —
# 이쪽은 배경색 참조라 부품 몸통과 배경 색이 뚜렷이 다를 때 강하다. 근거는
# core/process/mask/carve.py · core/process/utils/fill.py 참조.

flows:
-   object_type: flow
    name: remove_sam_holes_by_fill
    unit: frame
    processes:

    # 1. SAM3 분할 → 부품 라벨맵 (구멍 메워진 solid; carve 스킵 시 fallback 으로 남는다)
    -   object_type: segment
        text: Top-down view, solid plastic body only, ignore holes, ignore shadow,
            ignore conveyor background.
        conf: 0.0
        min_area: 200
        model:
            type: sam3
            bpe_path: ''
            checkpoint: ''
            device: cuda
        outputs:
            segment:
                to: storage
                level: frame
                type: segmap
                format: png
                dir: sam3_seg

    # 2. 몸통색 편차 seed + LoG 벽 floodFill 로 구멍 carve (mask ← SAM segment)
    -   object_type: carve_color_holes
        dev_thr: 40          # 몸통 평균색에서 이보다 크게 다른 픽셀만 seed (색이 확 다른 구멍)
        tolerance: 20        # floodFill 색 허용 (seed 색 대비 ±)
        highlight_thr: 0.0   # 반사광 제외 RGB 평균 밝기 (0=끄기; 예 220 이면 그보다 밝은 seed 제외)
        open_size: 5         # morphology OPEN — 작은 flood(반사광/잡티) 제거
        log_sigma: 1.2       # LoG 벽 블러
        log_factor: 1.0      # LoG edge 임계 배수 (클수록 벽 성겨 더 넓게 fill)
        grow: 2              # LoG 벽에 먹힌 경계 밴드 회복 (몸통색 밖에서만 팽창)
        min_area: 50         # 이보다 작은 구멍 조각 무시
        inputs:
            mask: segment
        outputs:
            mask:
                to: storage
                level: frame
                format: png
                dir: hole_carved_mask

    # 3. 구멍 뚫린 mask 를 인스턴스로 재분할
    -   object_type: split_objects
        min_area: 500
        merge_gap: 0
        bbox_gap: 0.15
        outputs:
            object: {}
            segment:
                to: storage
                level: frame
                type: segmap
                format: png
                dir: hole_carved_seg
