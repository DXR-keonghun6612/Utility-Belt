# 무채색 씬에서 물체에 반사된 밝은 띠만 골라내는 단일 per-frame flow.
#
# 프레임마다:
#   0. downscale          — 큰 프레임(4000px+)을 max_side 이하로 줄여 작은 해상도에서 CV 를 돌린다.
#        원본 크기는 source_hw 로 흘려 마지막에 되돌린다(고정 커널·속도 안정).
#   1. normalize_histogram — gray 대비를 선형 스트레칭해 밝기 분포를 펼친다. percentile(1~99)로
#        이상치에 강건하게 min~max 를 [0,255]로 편다. 결과 norm_frame 은 ctx 로만 흐른다(저장 안 함).
#        ※ 선형(minmax/percentile)을 쓴다 — equalize/clahe 는 비선형이라 뒤의 고정 밴드 임계가 흔들린다.
#   2. intensity_band     — 값이 [low, high] 밴드 안인 픽셀만 남긴다. 아래로 어두운 배경, 위로 포화된
#        광원(255)을 함께 잘라 그 사이 반사 띠만 mask 로 낸다(작은 해상도).
#   3. upscale            — 작은 mask 를 source_hw(원본 크기)로 되돌린다(라벨 보존 NEAREST).
#
# bbox 를 내는 step(split_objects 등)은 upscale **뒤**에 둬야 좌표가 원본 기준이 된다. 잡티가 남으면
# upscale 앞이나 뒤에 morph_mask(OPEN)를 잇는다(밴드 유닛은 despeckle 안 함). 근거는
# core/process/func/cv/filter.py(Band_threshold)·geom.py(Resize_*) · stream/preprocess/scale.py 참조.

flows:
-   object_type: flow
    name: extract_reflection_by_band
    unit: frame
    processes:

    # 0. 작은 해상도로 축소 (source_hw = 원본 크기, ctx 전용)
    -   object_type: downscale
        max_side: 1024       # 이보다 큰 프레임만 비율 유지로 축소

    # 1. gray 히스토그램 선형 정규화 (norm_frame — ctx 전용, 저장 안 함)
    -   object_type: normalize_histogram
        method: percentile   # minmax / percentile (선형) — equalize/clahe 아님
        low: 1.0             # 하단 clip 백분위
        high: 99.0           # 상단 clip 백분위

    # 2. 정규화된 gray 를 밝기 밴드로 clip → 반사 mask (작은 해상도)
    -   object_type: intensity_band
        low: 180             # 이보다 어두우면 버림(배경)
        high: 254            # 이보다 밝으면 버림(포화 광원)
        inputs:
            frame: norm_frame   # 1단의 정규화 결과를 threshold 입력으로 (원본 frame 아님)

    # 3. mask 를 원본 크기로 되돌려 저장
    -   object_type: upscale
        outputs:
            mask:
                to: storage
                level: frame
                type: segmap
                format: png
