# BGR 각 채널을 독립적으로 히스토그램 정규화하는 단일 per-frame flow.
#
# 프레임마다:
#   1. normalize_histogram — method 로 네 방식 중 선택:
#        minmax     — 채널 min–max → [0,255] 선형 스트레칭
#        percentile — low/high 백분위로 clip 후 스트레칭 (이상치 강건)
#        equalize   — 채널별 cv2.equalizeHist (CDF 균등화)
#        clahe      — 타일 단위 대비제한 적응 평활화 (clip_limit/tile)
#
# 입력 frame 은 채널 무관 IMAGE — gray·3ch·4ch 를 그대로 받고 채널 수는 primitive 가 런타임에
# 구분한다(4ch 는 alpha 보존). 결과는 norm_frame 으로 저장한다 — 출력 키가 곧 저장 폴더(kind-major)라,
# frame 으로 두면 원본 프레임 payload({범주}/frame/*.png)를 덮어쓴다. 그래서 별도 leaf 로 낸다.
# 방식별로 안 덮이게 남기려면 outputs 에 as 를 준다(예: as: norm_clahe → {범주}/norm_clahe/*.png).
# 디버깅이면 to: trace 로 바꾸면 트리 밖 .trace/{flow name}/ 에 쌓인다(정본 불변).
# 근거는 core/process/func/cv/color.py · core/process/stream/preprocess/color.py 참조.

flows:
-   object_type: flow
    name: normalize_histogram
    unit: frame
    processes:

    -   object_type: normalize_histogram
        method: clahe        # minmax / percentile / equalize / clahe
        clip_limit: 2.0      # CLAHE 대비 제한 (클수록 강한 평활화)
        tile: 8              # CLAHE 타일 격자 (n×n)
        low: 1.0             # percentile 하단 clip 백분위
        high: 99.0           # percentile 상단 clip 백분위
        outputs:
            norm_frame:
                to: storage
                level: frame
                type: image
                format: png
