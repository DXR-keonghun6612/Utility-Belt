# SAM3 부품 mask 에서 "메워진 구멍·슬릿"을 LoG edge + color floodFill 로 다시 뚫는 per-frame flow.
#
# 프레임마다:
#   1. segment           — 객체 bbox 를 SAM3 로 분할해 부품 라벨맵 segment (구멍이 메워진 solid).
#   2. carve_color_holes — 그 라벨맵 **안에서만**, 라벨별로 구멍을 뺀다. seed 는 세 기준을 다 통과한
#                          픽셀: (a) 몸통 평균색 편차의 평균 특이치 (dev > mean + k·std), (b) 객체
#                          바깥 링에서 잰 국소 배경색과 bg_tol 이내 (= 반사광이 아니라 배경이 비치는
#                          곳), (c) LoG 벽이 아님. 벽(LoG + 라벨 바깥)이 flood 를 가둬 이웃 객체·벨트로
#                          못 샌다. 출력은 obj_id 를 보존한 라벨맵 — 재분할이 필요 없다.
#
# 전제: 프레임에 객체 bbox 가 이미 있어야 한다(raw 추출 flow 선행 — extract_raw_mask_by_flood).
# 절대 밝기로 반사광을 거르지 않는다(흰 부품에선 몸통·반사광·구멍이 뒤섞임). 근거는
# core/process/mask/carve.py · core/process/utils/fill.py 참조.

flows:
-   object_type: flow
    name: remove_sam_holes_by_fill
    unit: frame
    processes:

    # 1. SAM3 분할 → 부품 라벨맵 (구멍 메워진 solid)
    -   object_type: segment
        text: Top-down view, solid plastic body only, ignore holes, ignore shadow,
            ignore conveyor background.
        conf: 0.0
        min_area: 200
        model:
            type: sam3
            bpe_path: ''
            checkpoint: ''
            device: cuda
        outputs:
            segment:
                to: storage
                level: frame
                type: segmap
                format: png
                dir: sam3_seg

    # 2. 라벨별 평균 특이치 + 국소 배경색 seed → LoG 벽 floodFill 로 구멍 carve
    -   object_type: carve_color_holes
        k: 2.0               # 평균 특이치 배수 — 임계 = mean(dev) + k·std(dev)
        bg_tol: 50           # 국소 배경색 근접 허용 (반사광 배제; 절대 밝기 아님)
        ring: 25             # 배경색 표본으로 쓸 객체 바깥 링 폭
        tolerance: 20        # floodFill 색 허용 (seed 색 대비 ±, FIXED_RANGE)
        log_sigma: 1.2       # LoG 벽 블러
        log_factor: 1.0      # LoG edge 임계 배수 (클수록 벽 성겨 더 넓게 fill)
        grow: 2              # LoG 벽에 먹힌 경계 밴드 회복 (배경색 픽셀에서만 팽창)
        open_size: 5         # morphology OPEN — 작은 flood(잡티) 제거
        min_area: 50         # 이보다 작은 구멍 조각 무시
        outputs:
            segment:
                to: storage
                level: frame
                type: segmap
                format: png
                dir: hole_carved_seg
