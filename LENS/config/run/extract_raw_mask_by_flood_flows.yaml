# LoG 벽 + 배경 color floodFill 로 프레임에서 객체 raw mask·bbox 를 뽑는 단일 per-frame flow.
#
# 프레임마다:
#   1. flood_background — params `roi`(벨트) 안에서 벨트색 seed 로 floodFill 하고 반전 = 객체.
#                         LoG edge 와 roi 바깥이 벽. Canny 윤곽을 이어 닫을 필요가 없다.
#   2. split_objects    — mask 를 인스턴스로 분리해 객체 bbox 생성.
#   3. order_objects    — 객체 순서 정렬(id 안정화).
#
# 이 flow 의 산출물은 실루엣이 아니라 **객체 bbox** — 뒤따르는 SAM3 flow 가 box 프롬프트로 쓴다.
# 근거는 core/process/mask/flood.py · core/process/utils/fill.py 참조.

flows:
-   object_type: flow
    name: extract_raw_obj_by_flood
    unit: frame
    processes:

    # 1. 벨트 배경 flood → 반전 = 객체 raw mask (roi 는 dataset params 에서 ctx 로 들어옴)
    -   object_type: flood_background
        belt_dev: 60         # 벨트 기준색(roi 중앙값) 편차 이내만 seed — 객체는 색이 멀어 제외
        tolerance: 4         # floodFill 색 허용 (이웃 대비; 조명 그래디언트는 따라가고 객체 경계서 멈춤)
        seeds: 64            # roi 에서 고르게 뽑는 seed 표본 수
        log_sigma: 1.2       # LoG 벽 블러
        log_factor: 1.0      # LoG edge 임계 배수 (클수록 벽 성겨 더 넓게 fill)
        roi_margin: 3        # roi 침식 — 경계 레일 edge 가 만드는 가짜 띠 제거
        open_size: 9         # morphology OPEN — 벨트에 남은 벽 조각 털기
        shrink: 1            # 실루엣 LoG 벽 두께 보정
        min_area: 2000       # 이보다 작은 조각 무시 (벨트 얼룩 오검출 차단)
        outputs:
            mask:
                to: storage
                level: frame
                format: png

    # 2. mask 를 인스턴스로 분리 → 객체 bbox
    -   object_type: split_objects
        min_area: 500
        mask_reverse: false
        merge_gap: 0
        bbox_gap: 0.15
        outputs:
            object: {}
            segment:
                to: storage
                level: frame
                type: segmap
                format: png

    # 3. 객체 순서 정렬 (id 안정화)
    -   object_type: order_objects
        outputs:
            object: {}
            segment:
                to: storage
                level: frame
                type: segmap
                format: png
