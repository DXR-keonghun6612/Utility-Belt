flows:
-   object_type: flow
    name: remove_sam_holes_by_belt_chroma
    unit: frame
    shared:
        space: hsv
    processes:
    -   object_type: segment
        text: Top-down view, solid plastic body only, ignore holes, ignore shadow,
            ignore conveyor background.
        conf: 0.0
        min_area: 200
        model:
            type: sam3
            bpe_path: ''
            checkpoint: ''
            device: cuda
        outputs:
            segment:
                to: storage
                level: frame
                type: segmap
                format: png
                dir: sam3_seg
    -   object_type: combine_mask
        mode: subtract
        max_change: -0.5
        drop_on_over: true
        inputs:
            mask: roi
            other: segment
        slots:
            mask: belt
        outputs:
            belt:
                to: storage
                level: frame
                format: png
                dir: belt_area
    -   object_type: convert_to_chroma
        space: hsv
    -   object_type: accumulate_chroma_histogram
        space: hsv
        per_pixel: false
        inputs:
            roi: belt
    -   object_type: robust_chroma_stats
        space: hsv
    -   object_type: chroma_distance
        space: hsv
        sigma_floor: 1.0
    -   object_type: threshold_score
        k: 1.0
        k_weak: null
        invert: false
        min_area: 0
        max_area: 0
        slots:
            mask: belt_near
        outputs:
            belt_near:
                to: storage
                format: png
                dir: obj_area
