# ─────────────────────────────────────────────────────────────────────────────
# sample tasker 레시피 — ImageFolder 형(classification), object 실루엣(mask) 크롭.
#
# taskers.yaml 의 한 엔트리(= Pipeline.Sample(name, cfg) 의 cfg)와 같은 스키마.
# GUI Sampler 창의 폼(task/unit/ratios/salt) + Processes 체인에 그대로 대응한다.
#
# 산출: {split}/{class}/{sample}.png  (torchvision ImageFolder 와 1:1)
#   class  = 정본 obj 의 class_id attr (없으면 unlabeled)
#   split  = frame stem 해시로 결정적 배정 (salt 로 재현성 유지한 채 재분할)
#   payload= object 실루엣(mask)을 정사각 규격화한 크롭 (RGB frame 아님)
# ─────────────────────────────────────────────────────────────────────────────

task: classification          # sink 종류 — {split}/{class}/{sample}
unit: object                  # 순회 단위 — object 마다 한 sample (obj = 한 실루엣)

ratios:                       # split 비율 (합=1 로 정규화됨)
  train: 0.8
  val:   0.1
  test:  0.1

salt: ''                      # split 해시 소금 (선택 — 같은 재현성, 다른 분할)

# Processes — 실체화 체인. materialize 모드가 켜져(체인이 있으면) source 가 정본 segment 에서 obj
# 별 이진 mask 를 ctx["mask"] 로 올린다. 그 mask 를 규격화해 실루엣 크롭을 만든다.
#
#   normalize_mask: mask 를 외접 정사각으로 crop → target_shape 로 pad (분류기 입력 규격화).
#   slots {mask: crop}: 출력 port `mask` 를 sink payload key `crop` 으로 재배선한다
#                       (sink 는 ctx["crop"] 만 payload 로 저장하므로 필수).
#
#   scale 255: 전경 픽셀을 0/255 로 확대 — png 로 봐도 보이는 실루엣 (scale=1 이면 0/1 이진).
processes:
  - object_type: normalize_mask
    target_shape: 224         # 실루엣 정사각 규격 (px)
    scale: 255                # 0/1 → 0/255 (눈으로 볼 수 있게; 1 이면 이진 유지)
    slots:
      mask: crop              # 출력 mask → sample payload(crop) 로 재배선
