[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "focus"
version = "0.1.0"
description = "3D virtual simulation environment for algorithm pre-validation and AI training-data generation."
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "scipy",
    "Pillow",
    "PyOpenGL",
    "PySide6",
    "bpy>=4.1.0",
    "usd-core",
    "python_toolbox @ git+https://github.com/DXR-keonghun6612/ToolBox.git@python_toolbox",
    "spatial_toolbox @ git+https://github.com/DXR-keonghun6612/ToolBox.git@spatial_toolbox",
]

[project.optional-dependencies]
dev = [
    "flake8",
    "black",
    "isort",
    "pytest",
]

[tool.setuptools.packages.find]
where = ["."]
exclude = ["submodules*", "data*", "result*", "config*"]
